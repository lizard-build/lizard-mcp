name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Matches the Node the Glama build spec installs, so a green run
          # here means the same code builds there.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Every Lizard CLI command must be mapped to MCP tools (or say why not), for the
      # CLI version the map was written against.
      - name: Lizard CLI coverage
        run: |
          npm install -g "@lizard-build/cli@$(node -p "require('./test/parity/cli-coverage.json').cliVersion")"
          npm run audit:cli
